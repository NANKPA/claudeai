# Landmark trading interviews, talks, documentaries & podcast episodes ("top podcast videos").
# This is a CURATED SEED, not a view-count ranking: the container that built it could not
# reach YouTube. tools/scrapers/youtube_top_search.py runs `discovery_queries` through
# yt-dlp, ranks by views x relevance, and writes landmark-media.scraped.yaml (top 100).
#
# verification:
#   verified  — existence + title confirmed by a web source during research (see sources)
#   known     — well-documented public item; URL to be resolved by the scraper
#   query     — a slot defined by a search query (scraper picks the top result)

media:
  - id: media_trader_1987_documentary
    title: "Trader (1987 PBS documentary) — Paul Tudor Jones"
    speaker_ids: [person_paul_tudor_jones]
    year: 1987
    format: documentary
    covers: [concept_trade_management, concept_fundamental_macro_analysis, concept_trading_psychology]
    key_takeaways: "Studies 1929 vs 1987 analogs; discipline and risk over prediction; reportedly pulled from circulation at Jones's request."
    verification: verified
    sources:
      - {title: "Market Folly — PTJ 1987 PBS film", url: "https://www.marketfolly.com/2009/07/paul-tudor-jones-1987-pbs-film-trader.html", tier: T3}
  - id: media_druckenmiller_lost_tree_2015
    title: "Stanley Druckenmiller — Lost Tree Club speech (Jan 2015)"
    speaker_ids: [person_stanley_druckenmiller]
    year: 2015
    format: speech (transcript)
    covers: [concept_position_sizing, concept_fundamental_macro_analysis, concept_reflexivity, concept_trading_psychology]
    key_takeaways: "'I was a pig': concentration over diversification; Soros doubled the 1992 GBP short to 200%; zero rates distort behaviour; the risk/reward of moving early."
    verification: verified
    sources:
      - {title: "Mauldin Economics", url: "https://www.mauldineconomics.com/overmyshoulder/article/stanley-druckenmiller-at-the-lost-tree-club", tier: T2}
      - {title: "Transcript (GitHub gist)", url: "https://gist.github.com/timhwang21/e6a2b24e064182dd9099ad00e4f4f9a6", tier: T3}
  - id: media_ptj_invest_like_the_best
    title: "Paul Tudor Jones on Invest Like the Best — 50-year career and philosophy"
    speaker_ids: [person_paul_tudor_jones, person_patrick_oshaughnessy]
    featured_in: [podcast_invest_like_the_best]
    format: podcast
    covers: [concept_fundamental_macro_analysis, concept_trade_management]
    verification: verified
  - id: media_dalio_economic_machine
    title: "How the Economic Machine Works — Ray Dalio"
    speaker_ids: [person_ray_dalio]
    year: 2013
    format: animated explainer (~30 min)
    covers: [concept_fundamental_macro_analysis, concept_market_regimes]
    key_takeaways: "Productivity + short-term debt cycle + long-term debt cycle; credit drives spending."
    verification: known
  - id: media_dalio_changing_world_order
    title: "Principles for Dealing with the Changing World Order — Ray Dalio"
    speaker_ids: [person_ray_dalio]
    year: 2022
    format: animated explainer
    covers: [concept_fundamental_macro_analysis]
    verification: known
  - id: media_seykota_whipsaw_song
    title: "The Whipsaw Song — Ed Seykota"
    speaker_ids: [person_ed_seykota]
    format: music video
    covers: [concept_trend_following, concept_trading_psychology]
    key_takeaways: "Trend followers must accept whipsaws as the cost of catching big trends."
    verification: known
  - id: media_covel_ep1000_jerry_parker
    title: "Trend Following Radio Ep. 1000 — Jerry Parker interview"
