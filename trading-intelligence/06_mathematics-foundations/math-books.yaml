# Mathematics foundations canon — books that underpin ANALYSIS (probability, statistics,
# time series, stochastic calculus) and EXECUTION (microstructure, impact, optimal trading,
# sizing). Grouped by track, ordered within each track from entry-level to advanced.
# level: 1 = accessible, 2 = undergraduate, 3 = graduate/research
# Books already in the trading top-100 are referenced by their book_* id via `also_in_top100`.

tracks:
  - {id: track_probability_statistics, title: "Track A — Probability & Statistics", layer: L0}
  - {id: track_stochastic_derivatives, title: "Track B — Stochastic Calculus & Derivatives", layer: L0}
  - {id: track_time_series_econometrics, title: "Track C — Time Series & Financial Econometrics", layer: L0}
  - {id: track_microstructure_execution, title: "Track D — Microstructure & Optimal Execution", layer: L5}
  - {id: track_risk_sizing_portfolio, title: "Track E — Risk, Sizing & Portfolio Mathematics", layer: L6}
  - {id: track_quant_ml_validation, title: "Track F — Quant Research, ML & Validation", layer: L8}

math_books:
  # ── Track A: Probability & Statistics ──
  - {id: mathbook_blitzstein_intro_probability, track: track_probability_statistics, level: 1, title: "Introduction to Probability", authors: [person_joe_blitzstein, person_jessica_hwang], author: "Joseph K. Blitzstein & Jessica Hwang", year: 2014,
     key_idea: "Intuition-first probability (Harvard Stat 110 companion): conditioning, expectation, distributions.", covers: [concept_probability_fat_tails, concept_expectancy]}
  - {id: mathbook_fifty_challenging_problems, track: track_probability_statistics, level: 1, title: "Fifty Challenging Problems in Probability with Solutions", authors: [person_frederick_mosteller], author: "Frederick Mosteller", year: 1965,
     key_idea: "Classic puzzles that build probabilistic intuition (gambler's ruin, waiting times).", covers: [concept_risk_of_ruin_drawdown, concept_probabilistic_thinking]}
  - {id: mathbook_feller_probability, track: track_probability_statistics, level: 3, title: "An Introduction to Probability Theory and Its Applications (Vol. I)", authors: [person_william_feller], author: "William Feller", year: 1950,
     key_idea: "The classic treatment of random walks, ruin problems, and limit theorems.", covers: [concept_random_walk_efficient_markets, concept_risk_of_ruin_drawdown]}
  - {id: mathbook_jaynes_probability_logic, track: track_probability_statistics, level: 3, title: "Probability Theory: The Logic of Science", authors: [person_et_jaynes], author: "E. T. Jaynes", year: 2003,
     key_idea: "Probability as extended logic; Bayesian inference and maximum entropy.", covers: [concept_probabilistic_thinking, concept_edge]}
  - {id: mathbook_all_of_statistics, track: track_probability_statistics, level: 2, title: "All of Statistics", authors: [person_larry_wasserman], author: "Larry Wasserman", year: 2004,
     key_idea: "Concise modern statistics: inference, bootstrap, hypothesis testing, multiple testing.", covers: [concept_overfitting_validation, concept_backtesting]}
  - {id: mathbook_casella_berger, track: track_probability_statistics, level: 3, title: "Statistical Inference", authors: [person_george_casella, person_roger_berger], author: "George Casella & Roger L. Berger", year: 1990,
     key_idea: "Rigorous estimation and hypothesis-testing theory.", covers: [concept_overfitting_validation]}
  - {id: mathbook_statistical_consequences_fat_tails, track: track_probability_statistics, level: 3, title: "Statistical Consequences of Fat Tails", authors: [person_nassim_taleb], author: "Nassim Nicholas Taleb", year: 2020,
     key_idea: "Why sample statistics, the LLN, and standard risk metrics fail under fat tails.", covers: [concept_probability_fat_tails, concept_performance_metrics]}
  - {id: mathbook_quant_interviews_zhou, track: track_probability_statistics, level: 2, title: "A Practical Guide to Quantitative Finance Interviews", authors: [person_xinfeng_zhou], author: "Xinfeng Zhou", year: 2008,
     key_idea: "Brain teasers, probability, stochastic calculus, and finance problems with solutions.", covers: [concept_probabilistic_thinking, concept_stochastic_processes]}
  - {id: mathbook_heard_on_the_street, track: track_probability_statistics, level: 2, title: "Heard on the Street", authors: [person_timothy_crack], author: "Timothy Falcon Crack", year: 1995,
     key_idea: "Quantitative interview questions in probability and finance.", covers: [concept_probabilistic_thinking]}

  # ── Track B: Stochastic Calculus & Derivatives ──
  - {id: mathbook_wilmott_introduces, track: track_stochastic_derivatives, level: 1, title: "Paul Wilmott Introduces Quantitative Finance", authors: [person_paul_wilmott], author: "Paul Wilmott", year: 2001,
     key_idea: "Accessible derivation of Black–Scholes and practical quant finance.", covers: [concept_options_greeks, concept_stochastic_processes]}
  - {id: mathbook_hull_options, track: track_stochastic_derivatives, level: 2, also_in_top100: book_options_futures_derivatives, title: "Options, Futures, and Other Derivatives", authors: [person_john_hull], author: "John C. Hull", year: 1989,
     key_idea: "Standard derivatives text: pricing, hedging, Greeks, volatility.", covers: [concept_options_greeks]}
  - {id: mathbook_shreve_stochastic_calculus, track: track_stochastic_derivatives, level: 3, title: "Stochastic Calculus for Finance I & II", authors: [person_steven_shreve], author: "Steven E. Shreve", year: 2004,
     key_idea: "Binomial to continuous-time: Brownian motion, Itô, risk-neutral pricing, change of measure.", covers: [concept_stochastic_processes, concept_options_greeks]}
  - {id: mathbook_bjork_arbitrage_theory, track: track_stochastic_derivatives, level: 3, title: "Arbitrage Theory in Continuous Time", authors: [person_tomas_bjork], author: "Tomas Björk", year: 1998,
     key_idea: "Martingale pricing, PDEs, and interest-rate theory with economic intuition.", covers: [concept_stochastic_processes]}
  - {id: mathbook_gatheral_volatility_surface, track: track_stochastic_derivatives, level: 3, title: "The Volatility Surface", authors: [person_jim_gatheral], author: "Jim Gatheral", year: 2006,
     key_idea: "Stochastic and local volatility models; fitting and trading the implied-vol surface.", covers: [concept_volatility, concept_options_greeks]}
  - {id: mathbook_karatzas_shreve, track: track_stochastic_derivatives, level: 3, title: "Brownian Motion and Stochastic Calculus", authors: [person_ioannis_karatzas, person_steven_shreve], author: "Ioannis Karatzas & Steven E. Shreve", year: 1988,
     key_idea: "Rigorous graduate reference for stochastic calculus.", covers: [concept_stochastic_processes]}

  # ── Track C: Time Series & Econometrics ──
  - {id: mathbook_ruppert_statistics_fin_eng, track: track_time_series_econometrics, level: 2, title: "Statistics and Data Analysis for Financial Engineering", authors: [person_david_ruppert, person_david_matteson], author: "David Ruppert & David S. Matteson", year: 2015,
     key_idea: "Applied statistics in R: returns, heavy tails, copulas, GARCH, regression.", covers: [concept_time_series_statistics, concept_probability_fat_tails]}
  - {id: mathbook_tsay_financial_time_series, track: track_time_series_econometrics, level: 2, title: "Analysis of Financial Time Series", authors: [person_ruey_tsay], author: "Ruey S. Tsay", year: 2002,
     key_idea: "ARMA, GARCH, high-frequency data, VaR: the practitioner's time-series text.", covers: [concept_time_series_statistics, concept_volatility]}
  - {id: mathbook_hamilton_time_series, track: track_time_series_econometrics, level: 3, title: "Time Series Analysis", authors: [person_james_hamilton], author: "James D. Hamilton", year: 1994,
     key_idea: "Definitive graduate text: unit roots, cointegration, regime-switching models.", covers: [concept_time_series_statistics, concept_market_regimes]}
  - {id: mathbook_campbell_lo_mackinlay, track: track_time_series_econometrics, level: 3, title: "The Econometrics of Financial Markets", authors: [person_john_campbell, person_andrew_lo, person_craig_mackinlay], author: "John Y. Campbell, Andrew W. Lo & A. Craig MacKinlay", year: 1997,
     key_idea: "Return predictability, event studies, microstructure, and asset-pricing tests.", covers: [concept_random_walk_efficient_markets, concept_time_series_statistics, concept_market_microstructure]}

  # ── Track D: Microstructure & Optimal Execution ──
  - {id: mathbook_harris_trading_exchanges, track: track_microstructure_execution, level: 1, also_in_top100: book_trading_and_exchanges, title: "Trading and Exchanges", authors: [person_larry_harris], author: "Larry Harris", year: 2003,
     key_idea: "Practitioner microstructure: traders, orders, dealers, liquidity.", covers: [concept_market_microstructure]}
  - {id: mathbook_ohara_microstructure_theory, track: track_microstructure_execution, level: 3, title: "Market Microstructure Theory", authors: [person_maureen_ohara], author: "Maureen O'Hara", year: 1995,
     key_idea: "Inventory and information models (Kyle, Glosten–Milgrom) of price formation.", covers: [concept_market_microstructure, concept_liquidity]}
  - {id: mathbook_hasbrouck_empirical_microstructure, track: track_microstructure_execution, level: 3, title: "Empirical Market Microstructure", authors: [person_joel_hasbrouck], author: "Joel Hasbrouck", year: 2007,
     key_idea: "Econometrics of trades and quotes: Roll model, price discovery, information shares.", covers: [concept_market_microstructure, concept_order_flow]}
  - {id: mathbook_bouchaud_trades_quotes_prices, track: track_microstructure_execution, level: 3, title: "Trades, Quotes and Prices", authors: [person_jean_philippe_bouchaud, person_julius_bonart, person_jonathan_donier, person_martin_gould], author: "Jean-Philippe Bouchaud, Julius Bonart, Jonathan Donier & Martin Gould", year: 2018,
     key_idea: "Financial markets under the microscope: order-book dynamics and the square-root impact law.", covers: [concept_optimal_execution_market_impact, concept_market_microstructure, concept_order_flow]}
  - {id: mathbook_cartea_algorithmic_hft, track: track_microstructure_execution, level: 3, title: "Algorithmic and High-Frequency Trading", authors: [person_alvaro_cartea, person_sebastian_jaimungal, person_jose_penalva], author: "Álvaro Cartea, Sebastian Jaimungal & José Penalva", year: 2015,
     key_idea: "Stochastic control for optimal execution, market making, and statistical arbitrage.", covers: [concept_optimal_execution_market_impact, concept_market_microstructure]}
  - {id: mathbook_gueant_market_liquidity, track: track_microstructure_execution, level: 3, title: "The Financial Mathematics of Market Liquidity", authors: [person_olivier_gueant], author: "Olivier Guéant", year: 2016,
     key_idea: "From Almgren–Chriss optimal execution to market making, block pricing, and buybacks.", covers: [concept_optimal_execution_market_impact, concept_liquidity],
     sources: [{title: "HAL record", url: "https://hal.archives-ouvertes.fr/hal-01393136", tier: T1}]}
  - {id: mathbook_lehalle_microstructure_practice, track: track_microstructure_execution, level: 2, also_in_top100: book_market_microstructure_in_practice, title: "Market Microstructure in Practice", authors: [person_charles_albert_lehalle, person_sophie_laruelle], author: "Charles-Albert Lehalle & Sophie Laruelle (eds.)", year: 2013,
     key_idea: "Fragmented markets and practical execution.", covers: [concept_market_microstructure]}
  - {id: mathbook_johnson_algorithmic_dma, track: track_microstructure_execution, level: 2, title: "Algorithmic Trading and DMA", authors: [person_barry_johnson], author: "Barry Johnson", year: 2010,
     key_idea: "Execution algorithms (VWAP, TWAP, IS, POV) and order-routing mechanics.", covers: [concept_optimal_execution_market_impact, concept_vwap, concept_trade_execution]}
  - {id: mathbook_kissell_optimal_trading, track: track_microstructure_execution, level: 2, title: "Optimal Trading Strategies", authors: [person_robert_kissell, person_morton_glantz], author: "Robert Kissell & Morton Glantz", year: 2003,
     key_idea: "Transaction-cost analysis and quantitative execution strategies.", covers: [concept_optimal_execution_market_impact]}
  - {id: paper_almgren_chriss_2000, track: track_microstructure_execution, level: 3, title: "Optimal Execution of Portfolio Transactions (paper, Journal of Risk)", authors: [person_robert_almgren, person_neil_chriss], author: "Robert Almgren & Neil Chriss", year: 2000,
     key_idea: "Mean-variance optimal liquidation trajectory under temporary/permanent impact.", covers: [concept_optimal_execution_market_impact]}
  - {id: paper_kyle_1985, track: track_microstructure_execution, level: 3, title: "Continuous Auctions and Insider Trading (paper, Econometrica)", authors: [person_albert_kyle], author: "Albert S. Kyle", year: 1985,
     key_idea: "Informed trading, noise traders, and price impact lambda.", covers: [concept_market_microstructure, concept_optimal_execution_market_impact]}

  # ── Track E: Risk, Sizing & Portfolio Mathematics ──
  - {id: paper_kelly_1956, track: track_risk_sizing_portfolio, level: 2, title: "A New Interpretation of Information Rate (paper, Bell System Technical Journal)", authors: [person_john_kelly], author: "J. L. Kelly Jr.", year: 1956,
     key_idea: "Maximise expected log wealth: the Kelly criterion.", covers: [concept_kelly_criterion_optimal_f],
     sources: [{title: "DOI", url: "https://doi.org/10.1002/j.1538-7305.1956.tb03809.x", tier: T1}]}
  - {id: mathbook_vince_mathematics_money_management, track: track_risk_sizing_portfolio, level: 2, also_in_top100: book_mathematics_of_money_management, title: "The Mathematics of Money Management", authors: [person_ralph_vince], author: "Ralph Vince", year: 1992,
     key_idea: "Optimal f, TWR, drawdown geometry.", covers: [concept_kelly_criterion_optimal_f, concept_position_sizing]}
  - {id: mathbook_kelly_capital_growth, track: track_risk_sizing_portfolio, level: 3, title: "The Kelly Capital Growth Investment Criterion", authors: [person_leonard_maclean, person_ed_thorp, person_william_ziemba], author: "Leonard C. MacLean, Edward O. Thorp & William T. Ziemba (eds.)", year: 2011,
     key_idea: "Collected theory and practice of growth-optimal betting, including fractional Kelly.", covers: [concept_kelly_criterion_optimal_f, concept_position_sizing]}
  - {id: mathbook_cover_thomas_information_theory, track: track_risk_sizing_portfolio, level: 3, title: "Elements of Information Theory", authors: [person_thomas_cover, person_joy_thomas], author: "Thomas M. Cover & Joy A. Thomas", year: 1991,
     key_idea: "Entropy, gambling and data compression, universal portfolios: the information-theory roots of Kelly.", covers: [concept_kelly_criterion_optimal_f]}
  - {id: mathbook_markowitz_portfolio_selection, track: track_risk_sizing_portfolio, level: 2, title: "Portfolio Selection: Efficient Diversification of Investments", authors: [person_harry_markowitz], author: "Harry Markowitz", year: 1959,
     key_idea: "Mean-variance optimisation and the efficient frontier.", covers: [concept_correlation_portfolio_risk]}
  - {id: mathbook_grinold_kahn_active_pm, track: track_risk_sizing_portfolio, level: 3, title: "Active Portfolio Management", authors: [person_richard_grinold, person_ronald_kahn], author: "Richard C. Grinold & Ronald N. Kahn", year: 1995,
     key_idea: "Fundamental law of active management: IR ≈ IC × √breadth.", covers: [concept_edge, concept_performance_metrics, concept_position_sizing]}
  - {id: mathbook_jorion_value_at_risk, track: track_risk_sizing_portfolio, level: 2, title: "Value at Risk", authors: [person_philippe_jorion], author: "Philippe Jorion", year: 1996,
     key_idea: "VaR methodologies, backtesting VaR, and stress testing.", covers: [concept_risk_of_ruin_drawdown, concept_correlation_portfolio_risk]}
  - {id: mathbook_mcneil_quantitative_risk, track: track_risk_sizing_portfolio, level: 3, title: "Quantitative Risk Management", authors: [person_alexander_mcneil, person_rudiger_frey, person_paul_embrechts], author: "Alexander J. McNeil, Rüdiger Frey & Paul Embrechts", year: 2005,
     key_idea: "Extreme value theory, copulas, and risk measures (ES/VaR).", covers: [concept_probability_fat_tails, concept_correlation_portfolio_risk]}
  - {id: mathbook_mandelbrot_fractals_scaling, track: track_risk_sizing_portfolio, level: 3, title: "Fractals and Scaling in Finance", authors: [person_benoit_mandelbrot], author: "Benoit B. Mandelbrot", year: 1997,
     key_idea: "Mandelbrot's technical papers on discontinuity, concentration, and scaling.", covers: [concept_probability_fat_tails]}
  - {id: mathbook_boyd_convex_optimization, track: track_risk_sizing_portfolio, level: 3, title: "Convex Optimization", authors: [person_stephen_boyd, person_lieven_vandenberghe], author: "Stephen Boyd & Lieven Vandenberghe", year: 2004,
     key_idea: "The optimisation toolkit behind portfolio construction and execution scheduling.", covers: [concept_correlation_portfolio_risk, concept_optimal_execution_market_impact]}

  # ── Track F: Quant Research, ML & Validation ──
  - {id: mathbook_isl, track: track_quant_ml_validation, level: 1, title: "An Introduction to Statistical Learning", authors: [person_gareth_james, person_daniela_witten, person_trevor_hastie, person_robert_tibshirani], author: "James, Witten, Hastie & Tibshirani", year: 2013,
     key_idea: "Accessible ML: regression, classification, resampling, regularisation, trees.", covers: [concept_machine_learning_finance, concept_overfitting_validation]}
  - {id: mathbook_esl, track: track_quant_ml_validation, level: 3, title: "The Elements of Statistical Learning", authors: [person_trevor_hastie, person_robert_tibshirani, person_jerome_friedman], author: "Hastie, Tibshirani & Friedman", year: 2001,
     key_idea: "The graduate reference for statistical learning; bias-variance and model selection.", covers: [concept_machine_learning_finance, concept_overfitting_validation]}
  - {id: mathbook_lopez_de_prado_afml, track: track_quant_ml_validation, level: 3, also_in_top100: book_advances_financial_ml, title: "Advances in Financial Machine Learning", authors: [person_marcos_lopez_de_prado], author: "Marcos López de Prado", year: 2018,
     key_idea: "Financial-data-specific ML methodology.", covers: [concept_machine_learning_finance]}
  - {id: mathbook_ml_asset_managers, track: track_quant_ml_validation, level: 2, title: "Machine Learning for Asset Managers", authors: [person_marcos_lopez_de_prado], author: "Marcos López de Prado", year: 2020,
     key_idea: "Denoising covariance matrices, clustering, feature importance, and backtest-overfitting tests.", covers: [concept_machine_learning_finance, concept_overfitting_validation, concept_correlation_portfolio_risk]}
  - {id: mathbook_jansen_ml_algo_trading, track: track_quant_ml_validation, level: 2, title: "Machine Learning for Algorithmic Trading", authors: [person_stefan_jansen], author: "Stefan Jansen", year: 2020,
     key_idea: "End-to-end Python workflow: data, alpha factors, models, backtests.", covers: [concept_machine_learning_finance, concept_backtesting]}
  - {id: mathbook_hilpisch_python_finance, track: track_quant_ml_validation, level: 1, title: "Python for Finance", authors: [person_yves_hilpisch], author: "Yves Hilpisch", year: 2014,
     key_idea: "Python tooling for financial analytics, simulation, and derivatives.", covers: [concept_backtesting, concept_stochastic_processes]}
  - {id: mathbook_finding_alphas, track: track_quant_ml_validation, level: 2, title: "Finding Alphas", authors: [person_igor_tulchinsky], author: "Igor Tulchinsky et al.", year: 2015,
     key_idea: "WorldQuant's practical guide to designing and testing alpha signals.", covers: [concept_edge, concept_overfitting_validation]}
  - {id: mathbook_aronson_ebta, track: track_quant_ml_validation, level: 2, also_in_top100: book_evidence_based_ta, title: "Evidence-Based Technical Analysis", authors: [person_david_aronson], author: "David Aronson", year: 2006,
     key_idea: "Data-snooping-robust testing of TA rules.", covers: [concept_overfitting_validation]}
  - {id: paper_deflated_sharpe_2014, track: track_quant_ml_validation, level: 3, title: "The Deflated Sharpe Ratio (paper, Journal of Portfolio Management)", authors: [person_david_bailey, person_marcos_lopez_de_prado], author: "David H. Bailey & Marcos López de Prado", year: 2014,
     key_idea: "Correct the Sharpe ratio for selection bias across many trials and non-normal returns.", covers: [concept_overfitting_validation, concept_performance_metrics]}
