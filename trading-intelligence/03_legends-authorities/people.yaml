# People registry — traders, authors, researchers, hosts.
# Relation lists accept a trailing "?" on an id to mark an INFERRED (plausible,
# not explicitly documented) link, e.g. influenced_by: ["person_richard_donchian?"]
# Facts below are from established literature (T1/T2) unless a `sources` entry
# says otherwise. Book authorship lives in books.yaml (`authors:`), not here.

