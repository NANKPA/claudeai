- id: philo_value_vs_price
  type: philosophy
  title: XV. The difference between value and price
  numeral: XV
  layer: L3
  lines: philosophy-of-the-relationship.md:690-726
  part_of:
  - philosophy_relationship
  expresses:
  - principle_05_mathematical_justification
  summary: A transaction fixes the terms of an exchange at one moment, not an objective or permanent value; participants disagree and revise their valuations. Fundamental, behavioural and statistical approaches
    each look for a usable relationship, and a gap between price and one's own value estimate starts an investigation rather than proving an edge, because the estimate may be wrong, the gap may persist,
    or costs may exceed the benefit.
