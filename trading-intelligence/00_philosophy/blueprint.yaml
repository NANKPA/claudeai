- id: philo_being_wrong
  type: philosophy
  title: XI. Being wrong is part of the system (decision quality vs. outcome)
  numeral: XI
  layer: L8
  lines: philosophy-of-the-relationship.md:524-568
  part_of:
  - philosophy_relationship
  expresses:
  - principle_08_decision_quality_not_outcome
  summary: 'Losses are built into probabilistic decisions: one result does not show whether a decision was good, because quality rests on the reasoning, evidence and risk at the time. Losing runs must still
    be tested against the strategy''s expected variation and limits, so the trader accepts being wrong about outcomes while refusing to be careless about reasoning.'
  grounded_in:
