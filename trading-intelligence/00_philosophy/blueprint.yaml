- id: philo_decisions_not_money
  type: philosophy
  title: XIII. Follow the right decisions, not the money
  numeral: XIII
  layer: L7
  lines: philosophy-of-the-relationship.md:612-648
  part_of:
  - philosophy_relationship
  expresses:
  - principle_12_process_not_money
  summary: Starting from 'how much can I make?' distorts judgment and makes every move look like an opportunity. The trader first asks about understanding, evidence, model fit, probabilities, the cost of
    being wrong, reward against risk and consistency with the process, and only then considers the money, accepting missed moves without abandoning discipline.
