- id: philo_mathematics_sword
  type: philosophy
  title: VII. Mathematics, the trader's sword (expected value; maths must serve the decision)
  numeral: VII
  layer: L0
  lines: philosophy-of-the-relationship.md:290-380
  part_of:
  - philosophy_relationship
  expresses:
  - principle_05_mathematical_justification
  summary: 'Mathematics turns observations into testable claims: how often, how large the wins and losses, how variable, what costs, and whether the result holds out of sample. A strategy is judged by expected
    value after costs and by the whole distribution of outcomes, not by its win rate. The simplest adequate model is preferred because the mathematics must serve the decision.'
