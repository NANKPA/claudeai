- id: philo_conditional_probability
  type: philosophy
  title: VI. Probability as the foundation of decisions; the law of large numbers; probability is conditional
  numeral: VI
  layer: L0
  lines: philosophy-of-the-relationship.md:216-288
  part_of:
  - philosophy_relationship
  expresses:
  - principle_04_conditional_probability
  summary: The future is uncertain, so decisions rest on probability. A probability holds only for a defined event, horizon and set of conditions. Many relevant observations are needed (the law of large
    numbers), and even a large sample does not guarantee the estimate will persist if conditions change.
