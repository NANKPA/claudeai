- id: philo_step_back
  type: philosophy
  title: IX. When understanding fails, step back (not trading is a decision)
  numeral: IX
  layer: L7
  lines: philosophy-of-the-relationship.md:436-478
  part_of:
  - philosophy_relationship
  expresses:
  - principle_06_do_not_force
  summary: 'When the trader cannot explain what the market is doing, the right response is to wait: continuous watching breeds over-interpretation and a compulsion to act, so standing aside until a recognisable,
    testable situation appears protects capital and attention, and not trading is itself a deliberate decision.'
