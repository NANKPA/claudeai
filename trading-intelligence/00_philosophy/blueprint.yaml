- id: philo_source_of_opportunity
  type: philosophy
  title: 'VIII. The source of a trading opportunity: understanding + evidence + mathematics'
  numeral: VIII
  layer: L4
  lines: philosophy-of-the-relationship.md:382-434
  part_of:
  - philosophy_relationship
  expresses:
  - principle_01_understand_before_acting
  - principle_05_mathematical_justification
  - principle_06_do_not_force
  summary: 'An opportunity exists only when three things agree: a defensible, testable explanation of what the setup represents (understanding), present conditions that match those in which it showed an
    advantage (evidence), and a favourable assessment of outcomes against risk after costs and estimate uncertainty (mathematics). When they disagree, the disagreement is investigated, not resolved in favour
    of the trade the trader wants.'
  grounded_in:
  - concept_edge?
  - concept_expectancy?
  - concept_market_regimes?
  - concept_overfitting_validation?
