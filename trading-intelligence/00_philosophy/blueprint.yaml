- id: philo_market_system_of_rules
  type: philosophy
  title: II. The market as a system governed by rules (the system vs. my model of it)
  numeral: II
  layer: L2
  lines: philosophy-of-the-relationship.md:40-73
  part_of:
  - philosophy_relationship
  expresses:
  - principle_01_understand_before_acting
  - principle_03_future_is_uncertain
  summary: The market follows real rules that are complex and change over time (supply and demand, information, structure, liquidity, behaviour, economic conditions). No trader can know them fully, so the
    trader builds a model of the system. The model is not the system and must be tested against the market continually.
