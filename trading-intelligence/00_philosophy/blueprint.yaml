- id: philo_market_is_relationship
  type: philosophy
  title: I. The market is a relationship; price is its visible expression
  numeral: I
  layer: L1
  lines: philosophy-of-the-relationship.md:18-38
  part_of:
  - philosophy_relationship
  expresses:
  - principle_01_understand_before_acting
  summary: The market is a system of interacting participants with different views of value, different needs and different resources, not a set of numbers. Price is the visible result of their transactions,
    so understanding price means investigating the conditions, incentives and interactions that produce it.
  grounded_in:
