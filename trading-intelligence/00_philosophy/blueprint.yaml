- id: philo_protect_process
  type: philosophy
  title: XII. Protect the process, not the ego
  numeral: XII
  layer: L7
  lines: philosophy-of-the-relationship.md:570-610
  part_of:
  - philosophy_relationship
  expresses:
  - principle_10_emotional_independence
  summary: 'Money creates pressure that pushes traders to abandon a tested method after losses or stretch it after wins. The trader follows the tested process rather than the desired outcome, and revises
    the method only through disciplined investigation of evidence, never under emotional pressure: consistent principles, flexible hypotheses, disciplined execution.'
