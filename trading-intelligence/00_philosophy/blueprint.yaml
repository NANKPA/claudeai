- id: philo_capital_preservation
  type: philosophy
  title: XIV. Capital preservation and survival (the asymmetry of losses)
  numeral: XIV
  layer: L6
  lines: philosophy-of-the-relationship.md:650-688
  part_of:
  - philosophy_relationship
  expresses:
  - principle_09_protect_capital
  summary: Capital is the resource that buys future participation. Because even a positive-expectancy strategy meets unfavourable sequences, sizing, leverage, drawdowns and ruin must be managed so that
    being wrong never removes the ability to continue; losses are asymmetric, since a 50% loss needs a 100% gain to recover.
