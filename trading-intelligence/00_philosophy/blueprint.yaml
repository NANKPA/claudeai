- id: philo_acb_principle
  type: philosophy
  title: 'III. The A → C → B principle: the destination is not the path'
  numeral: III
  layer: L2
  lines: philosophy-of-the-relationship.md:75-121
  part_of:
  - philosophy_relationship
  expresses:
  - principle_02_context_before_movement
  - principle_03_future_is_uncertain
  summary: A move against the expected direction (A to C) can still fit a larger move to B, so movements must be read at several levels and in context. But B is only a hypothesis, and the trader must tell
    movement within a structure apart from evidence that the structure itself has changed.
  grounded_in:
